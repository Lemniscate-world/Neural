version: "3.9"

services:
  neuraldbg-dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: bash -lc "sleep infinity"
    tty: true
    stdin_open: true
    volumes:
      - ./:/workspace
      - ./data:/data
      - ./models:/models
      - ./outputs:/outputs
