name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-security:
    name: Test and Security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov bandit safety

      - name: Run tests with coverage gate (>=60%)
        run: |
          pytest --cov=neuraldbg --cov-report=term-missing --cov-fail-under=60

      - name: Run Bandit
        run: |
          bandit -r . -ll -x tests,*/tests/*,.venv,venv,__pycache__

      - name: Run Safety
        run: |
          safety check --full-report
