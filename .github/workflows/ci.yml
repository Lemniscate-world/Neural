name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-security:
    name: Test and Security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Verify Python tooling
        run: |
          python --version
          python -m pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build backend tools
        run: |
          python -m pip install setuptools wheel

      - name: Install torch (CPU index)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch

      - name: Install QA tools
        run: |
          python -m pip install numpy "pytest>=9.0.3" pytest-cov coverage bandit safety
          # Real-integration deps for advertised callbacks (test_integrations_real.py)
          python -m pip install wandb pytorch-lightning

      - name: Install project in editable mode
        run: |
          python -m pip install -e .

      - name: Install neuraldbg-engine from local path
        run: |
          if [ -d "../NeuralDBG-Engine" ]; then
            python -m pip install -e ../NeuralDBG-Engine
          fi

      - name: Run tests with coverage gate
        run: |
          set +e
          # Run unit tests; pytest-cov handles coverage via pyproject.toml config
          python -m pytest tests/unit/ --cov-report=term-missing --cov-fail-under=75 2>&1 | tee /tmp/pytest-ci.log
          test_rc=${PIPESTATUS[0]}
          if [ "$test_rc" -ne 0 ]; then
            summary="$(grep -E -m 10 'FAILED|ERROR|Required test coverage|fail-under|No module named|Traceback|AssertionError' /tmp/pytest-ci.log | tr '\n' ' ' || true)"
            if [ -z "$summary" ]; then
              summary="$(tail -n 40 /tmp/pytest-ci.log | tr '\n' ' ')"
            fi
            summary="${summary//::/%3A%3A}"
            echo "::error title=CI test failure::${summary}"
            exit "$test_rc"
          fi


      - name: Run Bandit
        run: |
          # Scan only core (neuraldbg) — scripts/ use intentional shell/urlopen/exec (B602/B310/B102) and docs/ has B615
          python -m bandit -r neuraldbg -ll --skip B102,B310,B615,B101 2>&1 | tee /tmp/bandit.log; test ${PIPESTATUS[0]} -eq 0

      - name: Run Safety
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          python -m safety check --full-report

  pytorch-compat:
    name: PyTorch ${{ matrix.pytorch-version }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pytorch-version: "2.0.1"
            python-version: "3.11"
          - pytorch-version: "2.1.2"
            python-version: "3.11"
          - pytorch-version: "2.2.2"
            python-version: "3.11"
          - pytorch-version: "2.3.1"
            python-version: "3.11"
          - pytorch-version: "2.4.1"
            python-version: "3.12"
          - pytorch-version: "2.5.1"
            python-version: "3.12"
          - pytorch-version: "2.6.0"
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PyTorch ${{ matrix.pytorch-version }} (CPU)
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==${{ matrix.pytorch-version }}+cpu"

      - name: Install dependencies
        run: |
          python -m pip install numpy "pytest>=9.0.3" pytest-cov

      - name: Install project
        run: python -m pip install -e .

      - name: Verify PyTorch version
        run: |
          python -c "import torch; print(f'PyTorch {torch.__version__}')"
          python -c "import neuraldbg; print(f'NeuralDBG {neuraldbg.__version__}')"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -x -q --tb=short 2>&1
