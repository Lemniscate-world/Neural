name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-security:
    name: Test and Security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Verify Python tooling
        run: |
          python --version
          python -m pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build backend tools
        run: |
          python -m pip install setuptools wheel

      - name: Install torch (CPU index)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch

      - name: Install QA tools
        run: |
          python -m pip install pytest pytest-cov bandit safety

      - name: Run tests with coverage gate (>=60%)
        run: |
          pytest --cov=neuraldbg --cov-report=term-missing --cov-fail-under=60

      - name: Run Bandit
        run: |
          bandit -r . -ll -x tests,*/tests/*,.venv,venv,__pycache__

      - name: Run Safety
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m safety check --full-report
