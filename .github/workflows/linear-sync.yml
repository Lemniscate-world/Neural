name: Linear Issue Sync

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 8am
  workflow_dispatch:  # Manual trigger
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - list
          - report

jobs:
  linear-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync Linear issues
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        run: |
          if [ "${{ github.event.inputs.action }}" == "list" ]; then
            python scripts/linear_sync.py list --limit 50
          elif [ "${{ github.event.inputs.action }}" == "report" ]; then
            python scripts/linear_sync.py sync
          else
            python scripts/linear_sync.py sync
          fi

      - name: Create team report
        if: github.event.inputs.action == 'report'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        run: |
          echo "## Linear Team Report" > linear-report.md
          echo "Generated: $(date)" >> linear-report.md
          echo "" >> linear-report.md
          python scripts/linear_sync.py list --state open --limit 100 >> linear-report.md 2>&1
          echo "" >> linear-report.md
          python scripts/linear_sync.py list --state done --limit 20 >> linear-report.md 2>&1

      - name: Upload report
        if: github.event.inputs.action == 'report'
        uses: actions/upload-artifact@v4
        with:
          name: linear-team-report
          path: linear-report.md
