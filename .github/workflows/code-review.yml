name: Code Quality Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop, 'feat/*', 'fix/*', 'infra/*', 'ceo/*']

permissions:
  contents: read
  pull-requests: write

jobs:
  super-linter:
    name: Super Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter/slim@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Rule and session docs are synced from the shared rules repo and do not
          # follow markdownlint style constraints used for product docs.
          FILTER_REGEX_EXCLUDE: '(^|/)(AGENTS\.md|AI_GUIDELINES\.md|GAD\.md|copilot-instructions\.md|\.cursorrules|ia_rules/AI_GUIDELINES\.md|\.github/copilot-instructions\.md|SESSION_SUMMARY\.md|SESSION_SUMMARY\.md\.bak|mom_test_results\.md|mom_test_script\.md|decision\.md|acquisition_tracker\.md)$'
          # Enable core linters
          VALIDATE_PYTHON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true

      - name: Post Lint Summary
        if: always()
        run: |
          echo "## Code Review (Super-Linter)" >> $GITHUB_STEP_SUMMARY
          echo "Super-Linter completed. See job logs for details. Failing checks must be addressed to comply with AGENTS.md Rule 37." >> $GITHUB_STEP_SUMMARY
