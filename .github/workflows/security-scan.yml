name: Security Scans (Bandit & Safety)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop, 'feat/*', 'fix/*', 'infra/*', 'ceo/*']

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  python-security:
    name: Python Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install security tools
        run: |
          pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit (code static analysis)
        run: |
          PY_FILES=$(git ls-files '*.py' ':!:tests/**' ':!:venv/**' ':!:.venv/**' ':!:dist/**' ':!:build/**')
          if [ -z "$PY_FILES" ]; then
            echo '{"errors": [], "generated_at": "n/a", "metrics": {}, "results": []}' > bandit-report.json
            echo "No Python source files found for Bandit scan."
            exit 0
          fi
          # shellcheck disable=SC2086
          bandit -f json -o bandit-report.json -q --severity-level medium $PY_FILES

      - name: Upload Bandit results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-report.json
          retention-days: 3

      - name: Safety check (requirements.txt)
        if: hashFiles('requirements.txt') != ''
        run: |
          # Minimize output for public repositories by omitting verbose full-report
          safety check -r requirements.txt --output json > safety-results-requirements.json || true

      - name: Safety check (requirements-dev.txt)
        if: hashFiles('requirements-dev.txt') != ''
        run: |
          safety check -r requirements-dev.txt --output json > safety-results-requirements-dev.json || true

      - name: Safety check (fallback - installed environment)
        if: hashFiles('requirements.txt') == '' && hashFiles('requirements-dev.txt') == ''
        run: |
          echo "No requirements.txt or requirements-dev.txt found. Scanning installed environment as fallback."
          pip freeze > installed.txt || true
          safety check -r installed.txt --output json > safety-results-env.json || true

      - name: Upload Safety results artifact (private repos only; forks disabled)
        uses: actions/upload-artifact@v4
        if: github.event.repository.private == true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          name: safety-results
          path: |
            safety-results-*.json
          retention-days: 3

      - name: Post Security Scan Summary
        if: always()
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "bandit-report.json" ]; then
            echo "- Bandit JSON report uploaded as artifact (bandit-results)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Bandit report not generated" >> $GITHUB_STEP_SUMMARY
          fi
          if compgen -G "safety-results-*.json" > /dev/null; then
            echo "- Safety JSON results uploaded as artifact (private repos only; retention: 3 days; forks disabled)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Safety results not generated or artifact upload disabled for this event" >> $GITHUB_STEP_SUMMARY
          fi
