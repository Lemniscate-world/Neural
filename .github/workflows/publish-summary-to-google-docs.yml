name: Publish Session Summary to Google Docs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode (append or replace)"
        required: false
        default: "append"
        type: choice
        options:
          - append
          - replace
      source_path:
        description: "Source markdown path"
        required: false
        default: "SESSION_SUMMARY.md"
        type: string
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: read

jobs:
  publish:
    name: Publish Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYNC_MODE: ${{ github.event.inputs.mode || 'append' }}
      SOURCE_PATH: ${{ github.event.inputs.source_path || 'SESSION_SUMMARY.md' }}
      GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        id: guard
        run: |
          if [ -z "${GOOGLE_DOC_ID}" ] || [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing required secrets: GOOGLE_DOC_ID and/or GOOGLE_SERVICE_ACCOUNT_JSON" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-api-python-client

      - name: Publish SESSION_SUMMARY.md to Google Docs
        if: steps.guard.outputs.ready == 'true'
        run: |
          python scripts/publish_session_summary_to_gdocs.py \
            --source "${SOURCE_PATH}" \
            --doc-id "${GOOGLE_DOC_ID}" \
            --service-account-json "${GOOGLE_SERVICE_ACCOUNT_JSON}" \
            --mode "${SYNC_MODE}"

      - name: Summary
        if: always()
        run: |
          echo "Sync mode: ${SYNC_MODE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source path: ${SOURCE_PATH}" >> "$GITHUB_STEP_SUMMARY"
