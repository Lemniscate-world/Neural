name: Pre-commit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop, 'feat/*', 'fix/*', 'infra/*', 'ceo/*', 'sec/*']

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run pre-commit
        run: |
          python -m pre_commit run --all-files

      - name: Verify protected files are not tracked
        run: |
          python scripts/check_sensitive_files.py --all-tracked
