<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquarium — NeuralDBG Causal Viewer</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d2991d;
  --purple: #a371f7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
h1 { font-size: 20px; font-weight: 600; }
h1 span { color: var(--accent); }
.controls { display: flex; gap: 8px; }
button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; font-size: 13px; }
button:hover { background: #1f2937; }
button.accent { background: #1f6feb33; border-color: var(--accent); color: var(--accent); }
main { display: grid; grid-template-columns: 300px 1fr 300px; gap: 1px; background: var(--border); height: calc(100vh - 57px); }
main > * { background: var(--bg); padding: 16px; overflow-y: auto; }
.panel-title { font-size: 12px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.5px; }
.event-row { padding: 8px 10px; margin: 2px 0; border-radius: 4px; font-size: 12px; cursor: pointer; border-left: 3px solid transparent; }
.event-row:hover { background: var(--card); }
.event-row.type-data_anomaly { border-left-color: var(--yellow); }
.event-row.type-gradient_health_transition { border-left-color: var(--accent); }
.event-row.type-activation_regime_shift { border-left-color: var(--purple); }
.event-row.type-optimizer_instability { border-left-color: var(--red); }
.event-row.type-nan_detected { border-left-color: var(--red); background: #f8514922; }
.event-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
.event-to { color: var(--accent); }
.chain-card { padding: 10px 12px; margin: 4px 0; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
.chain-root { color: var(--yellow); font-weight: 600; }
.chain-symptom { color: var(--red); font-weight: 600; }
.chain-arrow { color: var(--muted); margin: 0 6px; }
.chain-score { float: right; font-size: 11px; color: var(--muted); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { padding: 10px; border: 1px solid var(--border); border-radius: 6px; text-align: center; }
.stat-value { font-size: 24px; font-weight: 700; }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
.drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px; text-align: center; color: var(--muted); cursor: pointer; margin-top: 16px; }
.drop-zone:hover { border-color: var(--accent); color: var(--accent); }
.empty-state { text-align: center; padding: 40px; color: var(--muted); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.badge-green { background: #3fb95022; color: var(--green); }
.badge-red { background: #f8514922; color: var(--red); }
.badge-yellow { background: #d2991d22; color: var(--yellow); }
</style>
</head>
<body>

<header>
  <h1>🐠 <span>Aquarium</span> — NeuralDBG Causal Viewer</h1>
  <div class="controls">
    <button onclick="loadSample()">Sample Data</button>
    <button class="accent" onclick="document.getElementById('fileInput').click()">📂 Open Export</button>
    <input type="file" id="fileInput" accept=".json" hidden onchange="loadFile(this)">
  </div>
</header>

<main>
  <!-- Left Panel: Events -->
  <div id="eventsPanel">
    <div class="panel-title">📋 Events</div>
    <div id="eventsList" class="empty-state">Drop a NeuralDBG export or click <b>Sample Data</b></div>
  </div>

  <!-- Center: Causal Chains -->
  <div id="chainsPanel">
    <div class="panel-title">🔗 Causal Chains</div>
    <div id="chainsList" class="empty-state">Chains appear here after loading data</div>
  </div>

  <!-- Right Panel: Stats -->
  <div id="statsPanel">
    <div class="panel-title">📊 Summary</div>
    <div id="statsContent" class="empty-state">Stats appear here after loading data</div>
  </div>
</main>

<script>
// ============================================================
// Data loading
// ============================================================
function loadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try { render(JSON.parse(e.target.result)); }
    catch(ex) { alert('Invalid JSON: ' + ex.message); }
  };
  reader.readAsText(file);
}

function loadSample() {
  const data = {
    events: [
      {event_type:'data_anomaly', layer_name:'Linear_3', step:3, from_state:'normal', to_state:'distribution_shift', confidence:0.9},
      {event_type:'gradient_health_transition', layer_name:'Linear_3', step:4, from_state:'healthy', to_state:'exploding', confidence:0.85},
      {event_type:'activation_regime_shift', layer_name:'ReLU_2', step:5, from_state:'normal', to_state:'saturated_activations', confidence:0.88},
      {event_type:'optimizer_instability', layer_name:'SGD', step:6, from_state:'stable', to_state:'diverging', confidence:0.92},
      {event_type:'nan_detected', layer_name:'Linear_3', step:7, from_state:'normal', to_state:'nan', confidence:1.0},
      {event_type:'gradient_health_transition', layer_name:'Linear_1', step:2, from_state:'healthy', to_state:'vanishing', confidence:0.82, metadata:{hidden_norms:[0.01,0.005,0.001]}},
      {event_type:'data_anomaly', layer_name:'Embedding_0', step:1, from_state:'normal', to_state:'nan_detected', confidence:1.0},
    ],
    hypotheses: [
      {description:'Root cause: exploding gradients in Linear_3, caused by data distribution shift.', confidence:0.9},
      {description:'Secondary: vanishing gradients detected in Linear_1 (BPTT).', confidence:0.82}
    ],
    causal_chains: [
      {root_cause:'data_anomaly[distribution_shift]', final_symptom:'optimizer_instability[diverging]', confidence:0.9, nodes:4, depth:3},
      {root_cause:'data_anomaly[nan_detected]', final_symptom:'gradient[vanishing]', confidence:0.82, nodes:3, depth:2},
    ],
    loss_history: [2.3,1.8,1.5,1.9,3.2,8.7,NaN,NaN],
    meta: {arch:'DeepMLP', family:'MLP', steps:8, timestamp:'2026-07-04T19:00:00Z'}
  };
  render(data);
}

// ============================================================
// Render
// ============================================================
function render(data) {
  renderEvents(data.events || []);
  renderChains(data.causal_chains || data.hypotheses || []);
  renderStats(data);
}

function renderEvents(events) {
  const el = document.getElementById('eventsList');
  if (!events.length) { el.innerHTML = '<div class="empty-state">No events</div>'; return; }
  
  const typeColors = {
    data_anomaly: 'type-data_anomaly',
    gradient_health_transition: 'type-gradient_health_transition',
    activation_regime_shift: 'type-activation_regime_shift',
    optimizer_instability: 'type-optimizer_instability',
    nan_detected: 'type-nan_detected',
    silent_corruption: 'type-nan_detected',
  };
  
  el.innerHTML = events.map(e => `
    <div class="event-row ${typeColors[e.event_type] || ''}">
      <strong>${e.event_type.replace(/_/g,' ')}</strong>
      <div class="event-meta">
        ${e.layer_name || '?'} @ step ${e.step ?? '?'} &nbsp;
        <span class="event-to">${e.to_state || e.from_state || ''}</span>
        ${e.confidence ? ` (${(e.confidence*100).toFixed(0)}%)` : ''}
      </div>
    </div>
  `).join('');
}

function renderChains(chains) {
  const el = document.getElementById('chainsList');
  if (!chains.length) { el.innerHTML = '<div class="empty-state">No causal chains</div>'; return; }
  
  el.innerHTML = chains.map((c,i) => {
    const root = c.root_cause || (c.description||'').split(':')[0] || '?';
    const symptom = c.final_symptom || '?';
    const score = c.confidence ? (c.confidence*100).toFixed(0)+'%' : '';
    return `
      <div class="chain-card">
        <span class="chain-score">${score}</span>
        <span class="chain-root">${root}</span>
        <span class="chain-arrow">→</span>
        <span class="chain-symptom">${symptom}</span>
        ${c.nodes ? `<div class="event-meta">${c.nodes} nodes, depth ${c.depth}</div>` : ''}
      </div>
    `;
  }).join('');
}

function renderStats(data) {
  const el = document.getElementById('statsContent');
  const events = data.events || [];
  const eventTypes = {};
  events.forEach(e => { eventTypes[e.event_type] = (eventTypes[e.event_type]||0)+1; });
  
  const nanEvents = events.filter(e => e.event_type === 'nan_detected' || e.to_state === 'nan').length;
  const explodingEvents = events.filter(e => e.to_state === 'exploding').length;
  const vanishingEvents = events.filter(e => e.to_state === 'vanishing').length;
  
  const loss = data.loss_history || [];
  const initialLoss = loss[0] || 0;
  const finalLoss = loss[loss.length-1] || 0;
  const lossTrend = isNaN(finalLoss) ? 'NaN' : finalLoss > initialLoss*2 ? 'Diverging' : finalLoss < initialLoss*0.5 ? 'Converging' : 'Stable';
  
  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat"><div class="stat-value">${events.length}</div><div class="stat-label">Events</div></div>
      <div class="stat"><div class="stat-value">${Object.keys(eventTypes).length}</div><div class="stat-label">Event Types</div></div>
      <div class="stat"><div class="stat-value" style="color:${nanEvents?'var(--red)':'var(--green)'}">${nanEvents}</div><div class="stat-label">NaN Events</div></div>
      <div class="stat"><div class="stat-value">${lossTrend}</div><div class="stat-label">Loss Trend</div></div>
    </div>
    <div style="margin-top:12px">
      <div class="panel-title">Event Types</div>
      ${Object.entries(eventTypes).map(([k,v]) => `
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
          <span>${k.replace(/_/g,' ')}</span>
          <span class="badge ${v>2?'badge-red':v>0?'badge-yellow':'badge-green'}">${v}</span>
        </div>
      `).join('')}
    </div>
    ${data.meta ? `
      <div style="margin-top:12px">
        <div class="panel-title">Meta</div>
        <div style="font-size:12px;color:var(--muted)">
          Arch: ${data.meta.arch||'?'} | Family: ${data.meta.family||'?'}<br>
          Steps: ${data.meta.steps||'?'} | Date: ${(data.meta.timestamp||'').slice(0,10)}
        </div>
      </div>
    ` : ''}
  `;
}

// Drag & drop
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = ev => { try { render(JSON.parse(ev.target.result)); } catch(ex) { alert('Invalid JSON'); } };
    reader.readAsText(file);
  }
});

// Load sample on first visit
setTimeout(loadSample, 500);
</script>
</body>
</html>
