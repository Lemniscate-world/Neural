repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
    -   id: ruff
        args: [ --fix ]
    -   id: ruff-format

-   repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
    -   id: bandit
        args: ["-lll"]
        description: "Run bandit security scan (Rule 6)"

-   repo: local
    hooks:
    -   id: pytest
        name: pytest
        entry: .venv/Scripts/python.exe -m pytest
        language: system
        types: [python]
        pass_filenames: false
        description: "Run pytest (Rule 5 & 18)"

    -   id: safety
        name: safety
        entry: .venv/Scripts/python.exe -m safety check
        language: system
        pass_filenames: false
        description: "Run safety check (Rule 6)"
